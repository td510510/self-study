# Buổi 40 — CI: chạy tự động MỖI LẦN push.
#
# Mục tiêu: không còn phụ thuộc việc ai đó NHỚ chạy test trước khi push.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Huỷ lần chạy cũ khi có push mới trên cùng nhánh —
# tiết kiệm tài nguyên và cho kết quả nhanh hơn.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kiem-tra:
    name: Lint & Test
    runs-on: ubuntu-latest

    # Dịch vụ phụ trợ — GitHub tự dựng container và dọn sau khi xong.
    # Đây là lý do ta Docker hoá ở buổi 27: môi trường CI giống hệt máy dev.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: matkhau_ci
          POSTGRES_DB: shop_test
        ports: ['5432:5432']
        # ⚠️ BẮT BUỘC có health check.
        # Không có nó, bước migrate chạy khi Postgres chưa sẵn sàng → fail ngẫu nhiên.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://shop:matkhau_ci@localhost:5432/shop_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: chuoi_bi_mat_chi_dung_cho_ci_khong_phai_that
      JWT_REFRESH_SECRET: chuoi_bi_mat_khac_chi_dung_cho_ci
      BCRYPT_COST: '4'
      LOG_LEVEL: silent
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Cache node_modules theo package-lock.json —
          # cùng nguyên lý với thứ tự COPY trong Dockerfile (buổi 27).
          cache: npm
          cache-dependency-path: code/project-02-ecommerce/package-lock.json

      - name: Cài dependency
        working-directory: code/project-02-ecommerce
        # npm ci chứ không npm install — cài ĐÚNG lock file, và
        # THẤT BẠI nếu lock không khớp. Đúng thứ ta muốn ở CI (buổi 27).
        run: npm ci

      - name: Sinh Prisma Client
        working-directory: code/project-02-ecommerce
        run: npx prisma generate

      - name: Chạy migration
        working-directory: code/project-02-ecommerce
        # migrate deploy, KHÔNG phải migrate dev —
        # dev có thể RESET database (cảnh báo buổi 12).
        run: npx prisma migrate deploy

      - name: Kiểm tra bảo mật dependency
        working-directory: code/project-02-ecommerce
        # A06 OWASP — thư viện lỗi thời (buổi 22).
        # continue-on-error: cảnh báo nhưng không chặn merge;
        # bỏ dòng này khi team đã sẵn sàng siết chặt.
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Chạy test
        working-directory: code/project-02-ecommerce
        run: npm test

  # Job riêng cho dự án NestJS — chạy SONG SONG với job trên
  kiem-tra-nest:
    name: Lint & Test (NestJS)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: matkhau_ci
          POSTGRES_DB: shop_nest_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://shop:matkhau_ci@localhost:5432/shop_nest_test?schema=public
      JWT_ACCESS_SECRET: chuoi_bi_mat_chi_dung_cho_ci_khong_phai_that
      JWT_REFRESH_SECRET: chuoi_bi_mat_khac_chi_dung_cho_ci
      BCRYPT_COST: '4'
      LOG_LEVEL: silent
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/project-04-nestjs/package-lock.json

      - working-directory: code/project-04-nestjs
        run: npm ci

      - working-directory: code/project-04-nestjs
        run: npx prisma generate

      - working-directory: code/project-04-nestjs
        run: npx prisma migrate deploy

      - name: Lint
        working-directory: code/project-04-nestjs
        run: npm run lint

      - name: Build (kiểm tra biên dịch TypeScript)
        working-directory: code/project-04-nestjs
        run: npm run build

      - name: Unit test
        working-directory: code/project-04-nestjs
        run: npm test

      - name: E2E test
        working-directory: code/project-04-nestjs
        run: npm run test:e2e
