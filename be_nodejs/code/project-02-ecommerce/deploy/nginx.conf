# Buổi 42 — Nginx làm reverse proxy.
#
# VÌ SAO KHÔNG EXPOSE NODE TRỰC TIẾP RA INTERNET?
#   1. Node không giỏi phục vụ file tĩnh bằng Nginx
#   2. Node không tự lo TLS/HTTPS tốt bằng Nginx
#   3. Nginx chịu được hàng chục nghìn kết nối rảnh mà tốn rất ít RAM
#   4. Nginx là nơi đặt rate limit lớp ngoài, nén gzip, cache tĩnh
#   5. Cần nhiều bản sao Node → Nginx làm load balancer

upstream shop_api {
    # least_conn: gửi request tới bản sao đang ÍT KẾT NỐI NHẤT.
    # Hợp với API có thời gian xử lý không đều.
    least_conn;

    server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
    # Thêm bản sao thì thêm dòng ở đây:
    # server 127.0.0.1:3001 max_fails=3 fail_timeout=30s;

    # Giữ sẵn kết nối tới Node — tránh bắt tay TCP mỗi request (buổi 20)
    keepalive 32;
}

# Rate limit LỚP NGOÀI, bổ sung cho rate limit trong app (buổi 23).
# Lớp này chặn trước khi request kịp tốn CPU của Node.
limit_req_zone $binary_remote_addr zone=chung:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=dangnhap:10m rate=1r/s;

server {
    listen 80;
    server_name shop.example.com;

    # Chuyển hết sang HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name shop.example.com;

    ssl_certificate     /etc/letsencrypt/live/shop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ⚠️ KHÔNG khoe phiên bản Nginx (nối buổi 23 — hidePoweredBy)
    server_tokens off;

    # Giới hạn kích thước body ở LỚP NGOÀI.
    # Chặn ở đây thì Node không phải đọc gì cả (buổi 17).
    client_max_body_size 2m;

    # Nén — giảm băng thông đáng kể cho JSON
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;

    location / {
        limit_req zone=chung burst=50 nodelay;

        proxy_pass http://shop_api;
        proxy_http_version 1.1;

        # ⚠️ BẮT BUỘC để req.ip trong app là IP THẬT của client.
        # Không có, mọi request trông như đến từ Nginx →
        # rate limit theo IP (buổi 23) chặn nhầm TẤT CẢ mọi người.
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host             $host;

        proxy_connect_timeout 5s;
        proxy_read_timeout   30s;
    }

    # Endpoint đăng nhập siết chặt hơn nhiều (buổi 15, 23)
    location /auth/dang-nhap {
        limit_req zone=dangnhap burst=5 nodelay;
        proxy_pass http://shop_api;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host            $host;
    }

    # ⚠️ WebSocket cần cấu hình RIÊNG (buổi 25).
    # Thiếu hai header Upgrade/Connection thì kết nối bị từ chối
    # và Socket.IO lặng lẽ lùi về long-polling — chậm hơn nhiều
    # mà không có lỗi nào báo.
    location /socket.io/ {
        proxy_pass http://shop_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        # WebSocket sống lâu — timeout mặc định 60s sẽ cắt kết nối
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # Health check không cần rate limit và không cần ghi log
    location /health {
        proxy_pass http://shop_api;
        access_log off;
    }
}
