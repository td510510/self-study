name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, product-service, order-service, notification-service, api-gateway]

    steps:
      - uses: actions/checkout@v4

      - name: Cài JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & test ${{ matrix.service }}
        working-directory: projects/p3-shop-microservices/${{ matrix.service }}
        run: mvn -B verify

      - name: Lưu báo cáo test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: projects/p3-shop-microservices/${{ matrix.service }}/target/surefire-reports/

  docker:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [auth-service, product-service, order-service, notification-service, api-gateway]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: projects/p3-shop-microservices/${{ matrix.service }}
          push: true
          # Tag theo commit SHA — KHÔNG dùng "latest" cho production
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
