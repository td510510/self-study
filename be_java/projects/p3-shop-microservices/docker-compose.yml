services:
  # ============================================================ HẠ TẦNG
  postgres:
    image: postgres:16-alpine
    container_name: shop-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      # Tạo sẵn 3 database — MỖI SERVICE MỘT DATABASE RIÊNG
      POSTGRES_MULTIPLE_DATABASES: auth_db,product_db,order_db,notification_db
    volumes:
      - shop-pgdata:/var/lib/postgresql/data
      - ./infra/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: shop-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: shop-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ============================================================ SERVICES
  auth-service:
    build: ./auth-service
    container_name: shop-auth
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/auth_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:?Phai dat JWT_SECRET trong file .env}
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      retries: 12

  product-service:
    build: ./product-service
    container_name: shop-product
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/product_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      SERVER_PORT: 8082
      SPRING_PROFILES_ACTIVE: docker   # log dạng JSON (xem logback-spring.xml)
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      retries: 12

  order-service:
    build: ./order-service
    container_name: shop-order
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      product-service: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/order_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      KAFKA_SERVERS: kafka:9092
      PRODUCT_SERVICE_URL: http://product-service:8082
      SERVER_PORT: 8083
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      retries: 12

  notification-service:
    build: ./notification-service
    container_name: shop-notification
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/notification_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      KAFKA_SERVERS: kafka:9092
      SERVER_PORT: 8084
    ports:
      - "8084:8084"

  api-gateway:
    build: ./api-gateway
    container_name: shop-gateway
    depends_on:
      auth-service: { condition: service_healthy }
      product-service: { condition: service_healthy }
      order-service: { condition: service_healthy }
    environment:
      JWT_SECRET: ${JWT_SECRET:?Phai dat JWT_SECRET trong file .env}
      REDIS_HOST: redis
      AUTH_SERVICE_URL: http://auth-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

  # ======================================================== GIÁM SÁT
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: shop-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: shop-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - shop-grafana:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  shop-pgdata:
  shop-grafana:
